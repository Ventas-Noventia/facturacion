<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de clientes · Noventia</title><link rel="stylesheet" href="/styles.css"></head><body><main class="login-view"><div class="login-card portal-register-card"><div class="login-mark">N</div><h2>Crea tu cuenta</h2><p class="login-copy">Utiliza el mismo correo o teléfono registrado en tu pedido.</p><form id="portalRegistroForm"><div class="grid"><label>Nombre completo<input id="registroNombre" required></label><label>Correo electrónico<input id="registroEmail" type="email" autocomplete="email" required></label><label>Teléfono<input id="registroTelefono" type="tel" inputmode="tel" maxlength="15" required></label><label>Contraseña<input id="registroPassword" type="password" minlength="8" autocomplete="new-password" required></label></div><label class="consent-check"><input id="registroPrivacidad" type="checkbox" required> Acepto el <a href="/aviso-privacidad.html" target="_blank" rel="noopener">aviso de privacidad</a> y las cookies esenciales.</label><button id="portalRegistroButton" type="submit">Crear cuenta</button><p id="portalAuthMensaje" class="form-message" role="alert"></p></form><p class="login-switch">¿Ya tienes cuenta? <a href="/portal-login.html">Inicia sesión</a></p></div></main><script type="module" src="/portal-auth.js"></script><script type="module" src="/consent.js"></script></body></html>
